<!doctype html>
<!-- Source for public/og-image.png (1200x630). Regenerate after a copy change:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
    --force-device-scale-factor=1 --window-size=1200,630 --virtual-time-budget=8000 \
    --screenshot=public/og-image.png "file://$PWD/assets-src/og-image.html"
  Copy mirrors the hero: first two lines of the h1, then the proof strip. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=block" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;background:#0A0A0A;overflow:hidden}
  body{font-family:Inter,sans-serif;font-weight:600;text-transform:uppercase;color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
  .brand{display:flex;align-items:center;gap:30px}
  .brand img{width:128px;height:auto;display:block}
  .brand span{font-size:84px;letter-spacing:.14em;line-height:1;margin-right:-.14em}
  .line{margin-top:48px;font-size:30px;letter-spacing:.04em}
  .proof{position:absolute;bottom:52px;display:flex;gap:36px;font-size:16px;letter-spacing:.2em;color:rgba(255,255,255,.5)}
  .proof span:last-child{color:#B793ED}
</style></head>
<body>
  <div class="brand"><img src="relay-mark.png" alt=""><span>Relay</span></div>
  <div class="line">Better marketing. Smarter automation.</div>
  <div class="proof"><span>More reach</span><span>More customers</span><span>Less admin</span></div>
</body></html>
